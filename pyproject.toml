[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deepseek-proxy"
version = "0.2.0"
description = "DeepSeek 网页 API 反代，提供 OpenAI 兼容端点"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "httpx[socks]>=0.25.0",
    "pydantic>=2.0",
    "wasmtime>=20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
deepseek-proxy = "deepseek_proxy.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/deepseek_proxy"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
